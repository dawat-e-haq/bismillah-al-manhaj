<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Bismillah Al-Manhaj</title>
  <style>
    body { font-family: 'Noto Naskh Arabic', serif; text-align: center; background: #f8f5f0; padding: 20px; }
    h1 { color: #0a5c36; }
    button { background: #0a5c36; color: white; border: none; padding: 12px 20px; margin: 8px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    #content { margin-top: 20px; padding: 15px; background: white; border-radius: 10px; display: none; }
  </style>
</head>
<body>
  <h1>بسم الله المنهج</h1>
  <p>Quran, Hadees aur Dua yahan milegi</p>

  <button onclick="showLang('quran')">📖 Quran</button>
  <button onclick="showLang('hadees')">📜 Hadees</button>
  <button onclick="showLang('dua')">🤲 Dua</button>

  <div id="content"></div>

  <script>
    function showLang(type) {
      let content = document.getElementById('content');
      content.style.display = 'block';
      
      if(type === 'quran') {
        content.innerHTML = '<h2>Quran</h2><p>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>';
      } 
      if(type === 'hadees') {
        content.innerHTML = '<h2>Hadees</h2><p>“Tum me sabse behtareen wo hai jo Quran seekhe aur sikhaye.” - Bukhari</p>';
      } 
      if(type === 'dua') {
        content.innerHTML = '<h2>Dua</h2><p>رَبِّ زِدْنِي عِلْمًا - Aye Allah! Mere ilm me izafa farma</p>';
      }
    }
  </script>
</body>
</html>
